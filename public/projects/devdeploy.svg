<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="p-dd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#p-dd)"/>
  <circle cx="400" cy="300" r="150" fill="#6366f1" fill-opacity="0.25" filter="blur(60px)"/>
  <rect x="150" y="100" width="500" height="350" rx="16" fill="#131728" stroke="#6366f1" stroke-width="4" fill-opacity="0.85"/>
  <!-- Terminal Header -->
  <rect x="150" y="100" width="500" height="40" rx="16" fill="#1e243b"/>
  <circle cx="180" cy="120" r="6" fill="#ef4444"/>
  <circle cx="200" cy="120" r="6" fill="#f59e0b"/>
  <circle cx="220" cy="120" r="6" fill="#10b981"/>
  <!-- Terminal Content / Nodes -->
  <text x="180" y="180" font-family="monospace" font-size="16" fill="#818cf8">$ devdeploy deploy --prod</text>
  <text x="180" y="215" font-family="monospace" font-size="14" fill="#34d399">✔ Building Docker image... done</text>
  <text x="180" y="245" font-family="monospace" font-size="14" fill="#34d399">✔ Pushing to container registry... done</text>
  <text x="180" y="275" font-family="monospace" font-size="14" fill="#34d399">✔ Provisioning SSL &amp; Routing... done</text>
  <text x="180" y="315" font-family="monospace" font-size="16" font-weight="bold" fill="#60a5fa">🚀 Live at https://app.devdeploy.io</text>
  <text x="400" y="520" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">DevDeploy</text>
  <text x="400" y="560" font-family="sans-serif" font-size="18" fill="#c7d2fe" text-anchor="middle">Automated Cloud Deployment &amp; CI/CD Orchestration</text>
</svg>
